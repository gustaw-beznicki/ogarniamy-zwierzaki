# Pull-request validation: builds, Bicep lint and a read-only resource-group what-if.
name: ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm run build

  api:
    name: api
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore services/api/ogarniamy-zwierzaki-api.csproj

      - run: dotnet build services/api/ogarniamy-zwierzaki-api.csproj --no-restore

      # Testcontainers starts a throwaway PostgreSQL on the runner's Docker.
      - run: dotnet test services/api.Tests/ogarniamy-zwierzaki-api.Tests.csproj

  infra:
    name: infra
    runs-on: ubuntu-24.04
    # Only this job may mint an OIDC token; web and api run PR code without it.
    permissions:
      contents: read
      id-token: write
    # No environment: the OIDC subject is repo:<owner>@<owner-id>/<name>@<repo-id>:pull_request, trusted only by the read-only PR identity.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bicep CLI
        run: az bicep install

      - name: Lint Bicep
        run: infra/deploy.sh lint

      # Fork pull requests receive no OIDC token, so the Azure steps run only for same-repository branches.
      - name: Azure login (read-only PR identity)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_PR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: infra/deploy.sh what-if
