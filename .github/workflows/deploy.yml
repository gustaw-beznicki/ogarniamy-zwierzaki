# Gated deployment: build and test every push to main, wait for approval, then apply Bicep,
# release the API and the web app, and run the end-to-end smoke test.
#
# Only the newest commit waits for approval: a newer push cancels an older run that is still
# waiting in `approve`. A run that has been approved is never cancelled mid-deployment;
# deployments run one at a time in `deploy`.
name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build web
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Testcontainers starts throwaway PostgreSQL and Azurite containers on the runner's Docker.
      - name: Test API
        run: dotnet test services/api.Tests/ogarniamy-zwierzaki-api.Tests.csproj

      # Scoped to the API project, so the tests are never deployed.
      - name: Publish and package API
        run: |
          publish_dir="${RUNNER_TEMP}/api-publish"
          mkdir -p "${RUNNER_TEMP}/api-package"
          dotnet publish services/api/ogarniamy-zwierzaki-api.csproj -c Release -o "${publish_dir}"
          # The publish output must sit at the zip root.
          (cd "${publish_dir}" && zip -r -q "${RUNNER_TEMP}/api-package/api.zip" .)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: apps/web/dist
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api
          path: ${{ runner.temp }}/api-package/api.zip
          retention-days: 7

  approve:
    name: approve
    needs: build
    runs-on: ubuntu-24.04
    # Required reviewer lives on this environment; waiting here holds no deployment slot.
    environment: production-approval
    concurrency:
      group: deploy-approval
      cancel-in-progress: true
    steps:
      - run: echo "Approved ${GITHUB_SHA}"

  deploy:
    name: deploy
    needs: approve
    runs-on: ubuntu-24.04
    # Only this environment's OIDC subject is trusted by the deploy identity (Contributor on rg-ogarniamy-mvp).
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web
          path: apps/web/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api
          path: ${{ runner.temp }}/api-package

      - name: Azure login (deploy identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: az bicep install

      - name: Apply infrastructure
        id: infra
        run: |
          outputs="$(infra/deploy.sh apply)"
          # Plain assignments so a missing output fails this step under bash -e.
          resource_group="$(jq -er '.resourceGroupName.value' <<<"${outputs}")"
          api_app="$(jq -er '.apiAppName.value' <<<"${outputs}")"
          api_host="$(jq -er '.apiDefaultHostName.value' <<<"${outputs}")"
          swa_name="$(jq -er '.staticWebAppName.value' <<<"${outputs}")"
          swa_host="$(jq -er '.staticWebAppDefaultHostName.value' <<<"${outputs}")"
          {
            echo "resource-group=${resource_group}"
            echo "api-app=${api_app}"
            echo "api-host=${api_host}"
            echo "swa-name=${swa_name}"
            echo "swa-host=${swa_host}"
          } >> "${GITHUB_OUTPUT}"

      - name: Deploy API
        env:
          RESOURCE_GROUP: ${{ steps.infra.outputs.resource-group }}
          API_APP: ${{ steps.infra.outputs.api-app }}
          ZIP_PATH: ${{ runner.temp }}/api-package/api.zip
        run: |
          az webapp deploy \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${API_APP}" \
            --type zip \
            --src-path "${ZIP_PATH}"

      - name: Fetch Static Web Apps deployment token
        id: swa-token
        env:
          RESOURCE_GROUP: ${{ steps.infra.outputs.resource-group }}
          SWA_NAME: ${{ steps.infra.outputs.swa-name }}
        run: |
          token="$(az staticwebapp secrets list \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${SWA_NAME}" \
            --query properties.apiKey \
            --output tsv)"
          [[ -n "${token}" ]] || { echo "Static Web Apps deployment token is empty" >&2; exit 1; }
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Deploy web
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
          api_location: ''

      - name: Smoke test
        env:
          SWA_HOST: ${{ steps.infra.outputs.swa-host }}
          API_HOST: ${{ steps.infra.outputs.api-host }}
        run: scripts/smoke.sh "${SWA_HOST}" "${API_HOST}"
