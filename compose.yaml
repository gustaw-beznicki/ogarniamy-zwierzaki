# Local PostgreSQL for development. The password comes from the untracked .env (see .env.example).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ogarniamy
    ports:
      # Host port; set POSTGRES_PORT in .env if 5432 is taken by another project.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
