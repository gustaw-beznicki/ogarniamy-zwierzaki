<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Logowanie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4D3F}a:hover{color:#173B30}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.disp{font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;letter-spacing:-0.02em}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-10px) rotate(var(--r))}}
@keyframes logoIn{0%{transform:scale(.6) rotate(-12deg);opacity:0}60%{transform:scale(1.08) rotate(4deg);opacity:1}100%{transform:none}}
.r1{animation:rise .5s .1s cubic-bezier(.2,.8,.2,1) both}
.r2{animation:rise .5s .18s cubic-bezier(.2,.8,.2,1) both}
.r3{animation:rise .5s .26s cubic-bezier(.2,.8,.2,1) both}
.logo{animation:logoIn .7s cubic-bezier(.3,1.4,.5,1) both}
.paw{position:absolute;color:#2C6553;animation:drift 6s ease-in-out infinite}
.seg{transition:transform .28s cubic-bezier(.34,1.3,.5,1)}
.segbtn{transition:color .2s}
.field{transition:box-shadow .2s,border-color .2s}
.field:focus-within{border-color:#1F4D3F;box-shadow:0 0 0 4px #DCE8E1}
.field input{border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:#1A1F1C;width:100%;min-width:0}
.field input::placeholder{color:#7A827D}
.cta{transition:transform .12s,background-color .2s}
.cta:hover{background:#173B30;color:#FFFFFF}
.cta:active{transform:scale(.97)}
.cta:hover .arr{transform:translateX(4px)}
.arr{transition:transform .2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5EF; color: #1A1F1C; font-family: Figtree, 'Segoe UI', system-ui, sans-serif">

<div style="position: absolute; left: 0; top: 0; right: 0; height: 360px; background: #1F4D3F; border-radius: 0 0 40px 40px; overflow: hidden">
<svg class="paw" viewBox="0 0 24 24" width="64" height="64" aria-hidden="true" style="left: 24px; top: 150px; --r: -18deg; fill: currentColor"><circle cx="5.6" cy="10.2" r="2.1"></circle><circle cx="9.2" cy="5.6" r="2.1"></circle><circle cx="14.8" cy="5.6" r="2.1"></circle><circle cx="18.4" cy="10.2" r="2.1"></circle><path d="M12 11.6c-2.9 0-5.7 3.3-5.7 5.8 0 1.7 1.2 2.6 2.7 2.6 1.3 0 2-.7 3-.7s1.7.7 3 .7c1.5 0 2.7-.9 2.7-2.6 0-2.5-2.8-5.8-5.7-5.8z"></path></svg>
<svg class="paw" viewBox="0 0 24 24" width="44" height="44" aria-hidden="true" style="left: 300px; top: 92px; --r: 22deg; fill: currentColor; animation-delay: -2s"><circle cx="5.6" cy="10.2" r="2.1"></circle><circle cx="9.2" cy="5.6" r="2.1"></circle><circle cx="14.8" cy="5.6" r="2.1"></circle><circle cx="18.4" cy="10.2" r="2.1"></circle><path d="M12 11.6c-2.9 0-5.7 3.3-5.7 5.8 0 1.7 1.2 2.6 2.7 2.6 1.3 0 2-.7 3-.7s1.7.7 3 .7c1.5 0 2.7-.9 2.7-2.6 0-2.5-2.8-5.8-5.7-5.8z"></path></svg>
<svg class="paw" viewBox="0 0 24 24" width="88" height="88" aria-hidden="true" style="left: 280px; top: 230px; --r: 8deg; fill: currentColor; animation-delay: -4s"><circle cx="5.6" cy="10.2" r="2.1"></circle><circle cx="9.2" cy="5.6" r="2.1"></circle><circle cx="14.8" cy="5.6" r="2.1"></circle><circle cx="18.4" cy="10.2" r="2.1"></circle><path d="M12 11.6c-2.9 0-5.7 3.3-5.7 5.8 0 1.7 1.2 2.6 2.7 2.6 1.3 0 2-.7 3-.7s1.7.7 3 .7c1.5 0 2.7-.9 2.7-2.6 0-2.5-2.8-5.8-5.7-5.8z"></path></svg>
</div>

<nav aria-label="Język" style="position: absolute; top: 16px; right: 16px; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.14)">
<a href="#" aria-current="true" style="min-width: 40px; padding: 7px 10px; border-radius: 999px; background: #FFFFFF; color: #1F4D3F; font-size: 13px; font-weight: 700; text-align: center; text-decoration: none">PL</a>
<a href="#" style="min-width: 40px; padding: 7px 10px; border-radius: 999px; color: #FFFFFF; font-size: 13px; font-weight: 700; text-align: center; text-decoration: none">EN</a>
</nav>

<div style="position: relative; padding: 76px 28px 0; display: flex; flex-direction: column; gap: 18px; color: #FFFFFF">
<div class="logo" style="width: 64px; height: 64px; border-radius: 20px; background: #F29E6B; display: grid; place-items: center; color: #1F4D3F">
<svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true" style="fill: currentColor"><circle cx="5.6" cy="10.2" r="2.1"></circle><circle cx="9.2" cy="5.6" r="2.1"></circle><circle cx="14.8" cy="5.6" r="2.1"></circle><circle cx="18.4" cy="10.2" r="2.1"></circle><path d="M12 11.6c-2.9 0-5.7 3.3-5.7 5.8 0 1.7 1.2 2.6 2.7 2.6 1.3 0 2-.7 3-.7s1.7.7 3 .7c1.5 0 2.7-.9 2.7-2.6 0-2.5-2.8-5.8-5.7-5.8z"></path></svg>
</div>
<div class="r1" style="display: flex; flex-direction: column; gap: 8px">
<h1 class="disp" style="margin: 0; font-size: 38px; line-height: 1.02; font-weight: 800">Ogarniamy<br>Zwierzaki</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.45; color: #CFE0D7">Prywatne archiwum dokumentów weterynaryjnych</p>
</div>
</div>

<div class="r2" style="position: absolute; left: 16px; right: 16px; top: 292px; background: #FFFFFF; border-radius: 28px; padding: 24px; box-shadow: 0 2px 4px rgba(26,31,28,.04), 0 24px 48px rgba(26,31,28,.12); display: flex; flex-direction: column; gap: 20px">

<div role="tablist" style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 999px; background: #EEF1EC">
<div class="seg" aria-hidden="true" style="position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: 44px; border-radius: 999px; background: #F29E6B; transform: {{segX}}"></div>
<button class="segbtn" role="tab" aria-selected="{{isSignin}}" onClick="{{toSignin}}" style="position: relative; z-index: 1; min-height: 44px; border: 0; background: transparent; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 700; color: #1A1F1C; cursor: pointer">Zaloguj się</button>
<button class="segbtn" role="tab" aria-selected="{{isRegister}}" onClick="{{toRegister}}" style="position: relative; z-index: 1; min-height: 44px; border: 0; background: transparent; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 700; color: #1A1F1C; cursor: pointer">Utwórz konto</button>
</div>

<form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #3A413D">E-mail
<span class="field" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border: 1.5px solid #D9DDD6; border-radius: 16px; background: #FBFAF7; color: #5B635E">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="m4 7 8 6 8-6"></path></svg>
<input type="email" placeholder="jan@example.com" autocomplete="email">
</span>
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #3A413D">Hasło
<span class="field" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border: 1.5px solid #D9DDD6; border-radius: 16px; background: #FBFAF7; color: #5B635E">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect><path d="M8 10.5v-3a4 4 0 0 1 8 0v3"></path></svg>
<input type="password" placeholder="Co najmniej 10 znaków" autocomplete="current-password">
</span>
</label>
<a class="cta" href="Mobile-Animals.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; border-radius: 16px; background: #1F4D3F; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none; margin-top: 4px">{{cta}}<svg class="i arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</form>
</div>

<div class="r3" style="position: absolute; left: 32px; right: 32px; bottom: 36px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #5B635E; font-size: 14px; text-align: center">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; color: #1F6E52"><path d="M12 3 5 6v5.5c0 4.3 3 7.7 7 9.5 4-1.8 7-5.2 7-9.5V6z"></path><path d="m9 12 2.2 2.2L15.5 10"></path></svg>
<span>Oryginały widzi tylko właściciel konta</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { mode: 'signin' };
}
renderVals() {
const signin = this.state.mode === 'signin';
return {
segX: signin ? 'translateX(0)' : 'translateX(100%)',
isSignin: signin ? 'true' : 'false',
isRegister: signin ? 'false' : 'true',
cta: signin ? 'Zaloguj się' : 'Utwórz konto',
toSignin: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ mode: 'signin' }); },
toRegister: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ mode: 'register' }); }
};
}
}
</script>
</body>
</html>
