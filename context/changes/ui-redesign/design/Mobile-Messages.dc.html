<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Komunikaty w kontekście</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4D3F}a:hover{color:#173B30}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.g{width:18px;height:18px;fill:none;stroke:#FFFFFF;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.disp{font-family:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;letter-spacing:-0.02em}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toastIn{0%{opacity:0;transform:translateY(-40px) scale(.94)}60%{opacity:1;transform:translateY(4px) scale(1.01)}100%{transform:none}}
@keyframes timer{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(183,121,31,.45)}70%{box-shadow:0 0 0 10px rgba(183,121,31,0)}100%{box-shadow:0 0 0 0 rgba(183,121,31,0)}}
@keyframes tabIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.r0{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.r1{animation:rise .45s .08s cubic-bezier(.2,.8,.2,1) both}
.r2{animation:rise .45s .16s cubic-bezier(.2,.8,.2,1) both}
.r3{animation:rise .45s .24s cubic-bezier(.2,.8,.2,1) both}
.toast{animation:toastIn .5s .5s cubic-bezier(.3,1.2,.5,1) both}
.timer{transform-origin:left;animation:timer 4.5s 1s linear forwards}
.ring{animation:ring 1.8s ease-out infinite}
.act{transition:background-color .2s,transform .12s}
.act:hover{background:#3F2C05}
.act:active{transform:scale(.97)}
.x{transition:background-color .2s}
.x:hover{background:rgba(26,31,28,.08)}
.back:hover .bc{background:#1F4D3F;color:#FFFFFF}
.bc{transition:background-color .2s,color .2s}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:20px;color:#3A413D;font-size:12px;font-weight:600;text-decoration:none;min-height:56px;transition:background-color .2s}
.tab:hover{background:#F3F2EC;color:#1A1F1C}
.tab.on{background:#1F4D3F;color:#FFFFFF;animation:tabIn .32s cubic-bezier(.34,1.3,.5,1) both}
.tab.on:hover{color:#FFFFFF}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5EF; color: #1A1F1C; font-family: Figtree, 'Segoe UI', system-ui, sans-serif">
<div style="padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 18px">

<div class="r0" style="display: flex; align-items: center; min-height: 44px">
<a class="back" href="Mobile-Animals.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; color: #1A1F1C; font-size: 15px; font-weight: 600; text-decoration: none">
<span class="bc" style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; display: grid; place-items: center; box-shadow: 0 1px 2px rgba(26,31,28,.06)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="m15 6-6 6 6 6"></path></svg></span>Wróć do listy zwierząt</a>
</div>

<section class="r1" aria-label="Profil zwierzaka" style="border-radius: 30px; padding: 22px; display: flex; align-items: center; gap: 16px; background: {{heroBg}}; color: {{heroFg}}; transition: background-color .4s, color .4s">
<span class="disp" style="width: 72px; height: 72px; border-radius: 24px; display: grid; place-items: center; font-size: 32px; font-weight: 800; background: {{avBg}}; color: {{avFg}}; transition: background-color .4s">F</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 class="disp" style="margin: 0; font-size: 32px; line-height: 1; font-weight: 800">Fiona</h1>
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: {{pillBg}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{dot}}"></span>{{statusLabel}}</span>
</div>
</section>

<sc-if value="{{inactive}}" hint-placeholder-val="{{ true }}">
<div class="r2" role="status" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; background: #FFF3D9; border: 1px solid #F1DCA6; color: #5E4108">
<div style="display: flex; gap: 12px; align-items: flex-start">
<span class="ring" style="width: 32px; height: 32px; border-radius: 50%; background: #B7791F; display: grid; place-items: center; flex: none"><svg class="g" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v6M12 17h.01"></path></svg></span>
<span style="font-size: 15px; line-height: 1.45; font-weight: 600; padding-top: 5px">Ten zwierzak jest nieaktywny. Jego dokumenty pozostają dostępne; aby dodać nowe, oznacz go jako aktywnego.</span>
</div>
<button class="act" onClick="{{activate}}" style="align-self: flex-start; margin-left: 44px; min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #5E4108; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Oznacz jako aktywnego</button>
</div>
</sc-if>

<div class="r3" style="display: flex; flex-direction: column; gap: 4px; padding-top: 4px">
<h2 class="disp" style="margin: 0; font-size: 24px; font-weight: 800">Dokumenty</h2>
<p style="margin: 0; font-size: 14px; color: #5B635E">Od najnowszej daty zdarzenia.</p>
</div>

<a class="r3" href="Mobile-Document.dc.html" aria-label="Otwórz dokument z dnia 9 maja 2026" style="display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 20px; background: #FFFFFF; color: #1A1F1C; text-decoration: none; box-shadow: 0 1px 2px rgba(26,31,28,.04), 0 6px 18px rgba(26,31,28,.05)">
<span style="width: 50px; height: 60px; border-radius: 10px; background: #FDE7D8; display: grid; place-items: center; color: #8A4317; flex: none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path><rect x="7.5" y="12" width="9" height="5" rx="1.2"></rect></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px; flex: 1"><span style="font-size: 17px; font-weight: 700">9 maja 2026</span><span style="font-size: 13px; color: #5B635E">PDF</span><span style="font-size: 13px; color: #5B635E">Data dodania: 10.05.2026</span></span>
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; color: #5B635E"><path d="m9 6 6 6-6 6"></path></svg>
</a>
</div>

<div aria-live="polite" style="position: absolute; left: 12px; right: 12px; top: 12px">
<sc-for list="{{toasts}}" as="t" hint-placeholder-count="1">
<div class="toast" role="status" style="position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; padding: 12px 6px 12px 12px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 2px 4px rgba(26,31,28,.05), 0 16px 40px rgba(26,31,28,.2)">
<span style="width: 32px; height: 32px; border-radius: 50%; background: #1F6E52; display: grid; place-items: center; flex: none"><svg class="g" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12.5 4 4L18 8.5"></path></svg></span>
<span style="flex: 1; font-size: 14px; line-height: 1.4; font-weight: 600">{{t.text}}</span>
<button class="x" aria-label="Zamknij" onClick="{{t.close}}" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #5B635E; display: grid; place-items: center; cursor: pointer; flex: none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
<span class="timer" aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #1F6E52"></span>
</div>
</sc-for>
</div>

<nav aria-label="Nawigacja główna" style="position: absolute; left: 16px; right: 16px; bottom: 16px; padding: 6px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 2px 4px rgba(26,31,28,.04), 0 16px 40px rgba(26,31,28,.14); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 60px; gap: 4px">
<a class="tab" href="Mobile-Search.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Szukaj</a>
<a class="tab" href="Mobile-Add.dc.html"><span style="width: 28px; height: 28px; border-radius: 50%; background: #F29E6B; color: #1A1F1C; display: grid; place-items: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.25"><path d="M12 5v14M5 12h14"></path></svg></span>Dodaj</a>
<a class="tab on" href="Mobile-Animals.dc.html" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.6" cy="10.2" r="2"></circle><circle cx="9.2" cy="5.6" r="2"></circle><circle cx="14.8" cy="5.6" r="2"></circle><circle cx="18.4" cy="10.2" r="2"></circle><path d="M12 12c-2.8 0-5.5 3.2-5.5 5.6 0 1.6 1.2 2.4 2.6 2.4 1.2 0 1.9-.6 2.9-.6s1.7.6 2.9.6c1.4 0 2.6-.8 2.6-2.4 0-2.4-2.7-5.6-5.5-5.6z"></path></svg>Zwierzęta</a>
<a class="tab" href="Mobile-Signin.dc.html" aria-label="Wyloguj się"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 17l-5-5 5-5M5 12h11"></path></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { active: false, toasts: [{ id: 1, text: 'Oznaczono jako nieaktywnego. Wszystkie dokumenty pozostają dostępne.' }], next: 2 };
this.timers = [];
}
componentDidMount() {
this.timers.push(setTimeout(() => this.close(1), 5600));
}
componentWillUnmount() {
this.timers.forEach((t) => clearTimeout(t));
}
close(id) {
this.setState({ toasts: this.state.toasts.filter((t) => t.id !== id) });
}
renderVals() {
const a = this.state.active;
return {
inactive: !a,
heroBg: a ? '#1F4D3F' : '#ECEBE5',
heroFg: a ? '#FFFFFF' : '#1A1F1C',
avBg: a ? '#F29E6B' : '#FFFFFF',
avFg: a ? '#1F4D3F' : '#5B635E',
pillBg: a ? 'rgba(255,255,255,.14)' : '#FFFFFF',
dot: a ? '#8FE0B7' : '#8A918C',
statusLabel: a ? 'Aktywny' : 'Nieaktywny',
toasts: this.state.toasts.map((t) => ({ text: t.text, close: () => this.close(t.id) })),
activate: () => {
const id = this.state.next;
this.setState({ active: true, toasts: [{ id: id, text: 'Oznaczono jako aktywnego.' }], next: id + 1 });
this.timers.push(setTimeout(() => this.close(id), 5600));
}
};
}
}
</script>
</body>
</html>
